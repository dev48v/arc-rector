# Arc Rector on an Oracle Cloud Always Free A1.Flex VM (aarch64 / ARM64).
#
#   docker compose -f docker-compose.a1.yml up -d
#
# Differences from the local docker-compose.yml, and why each one exists:
#
#   * Every image is linux/arm64-capable. The A1.Flex shape is Ampere ARM, and a
#     silent amd64 pull either fails or crawls under emulation.
#   * Every service has an explicit `mem_limit`. The target box is SHARED with
#     other workloads, so an unbounded ClickHouse taking the host down would take
#     someone else's service with it. The limits below total 7998 MB -- see the
#     budget at the bottom of this file, which is measured, not guessed.
#   * Every port binds to 127.0.0.1, and every host port is a variable with a
#     default. A shared box may already have something on 3000; set ARC_PORT_*
#     in .env rather than editing this file. The box's ingress is hardened to
#     TCP 22 only; public access is via a Cloudflare tunnel, never an open port.
#   * Every credential is a REQUIRED variable (`${VAR:?...}`), not a defaulted
#     one. The local docker-compose.yml ships fixed weak passwords on purpose --
#     it listens on loopback on your own laptop. This file is for a shared,
#     tunnel-reachable box, so it refuses to start rather than quietly boot on
#     credentials that are published in a public repository.
#     Generate them once:  ./deploy/a1-setup.sh --gen-secrets
#   * Every container name is prefixed `arc-rector-` so it can never collide
#     with containers already on the box.
#   * The default model is a 3B, not an 8B. The constraint is CPU speed, not
#     disk: there is no GPU, so an 8B answers at roughly 2-5 tokens/second.
#
# Read DEPLOY.md before running this. It is a shared machine.

name: arc-rector

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0          # multi-arch, includes linux/arm64
    container_name: arc-rector-qdrant
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    ports:
      - "127.0.0.1:${ARC_PORT_QDRANT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  langfuse-web:
    image: langfuse/langfuse:3.225.2
    container_name: arc-rector-langfuse-web
    restart: unless-stopped
    # The single biggest consumer after Ollama, and the one that must NOT be
    # trimmed: Node sizes its old-space from the cgroup, and at 1500m it got a
    # ~750 MB heap, which Langfuse v3 does not fit into -- the container
    # OOM-looped on boot. NODE_OPTIONS below pins the heap explicitly.
    mem_limit: 1700m
    memswap_limit: 1700m
    depends_on:
      langfuse-postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    ports:
      # Host port only. Everything inside the compose network still reaches
      # Langfuse at http://langfuse-web:3000, so moving this changes nothing else.
      - "127.0.0.1:${ARC_PORT_LANGFUSE:-3000}:3000"
    environment: &langfuse-env
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?run ./deploy/a1-setup.sh --gen-secrets first}@langfuse-postgres:5432/postgres
      SALT: ${LANGFUSE_SALT:?run ./deploy/a1-setup.sh --gen-secrets first}
      # Quote this. Unquoted, YAML reads an all-digit hex string as the integer
      # 0 and Langfuse refuses to boot. Regenerate: openssl rand -hex 32
      ENCRYPTION_KEY: "${LANGFUSE_ENCRYPTION_KEY:?run ./deploy/a1-setup.sh --gen-secrets first}"
      NEXTAUTH_URL: ${PUBLIC_URL:-http://localhost:${ARC_PORT_LANGFUSE:-3000}}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?run ./deploy/a1-setup.sh --gen-secrets first}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?run ./deploy/a1-setup.sh --gen-secrets first}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${REDIS_PASSWORD:?run ./deploy/a1-setup.sh --gen-secrets first}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:?run ./deploy/a1-setup.sh --gen-secrets first}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:?run ./deploy/a1-setup.sh --gen-secrets first}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      LANGFUSE_INIT_ORG_ID: arc-rector
      LANGFUSE_INIT_ORG_NAME: Arc Rector
      LANGFUSE_INIT_PROJECT_ID: arc-rector
      LANGFUSE_INIT_PROJECT_NAME: Arc Rector
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?run ./deploy/a1-setup.sh --gen-secrets first}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?run ./deploy/a1-setup.sh --gen-secrets first}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_USER_EMAIL:-demo@arc-rector.local}
      LANGFUSE_INIT_USER_NAME: Arc Rector
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_USER_PASSWORD:?run ./deploy/a1-setup.sh --gen-secrets first}
      # Node reads the cgroup to size its heap, and its guess is too generous
      # for a limit this tight. Say it outright, ~70% of mem_limit.
      NODE_OPTIONS: "--max-old-space-size=1200"

  langfuse-worker:
    image: langfuse/langfuse-worker:3.225.2
    container_name: arc-rector-langfuse-worker
    restart: unless-stopped
    mem_limit: 560m
    memswap_limit: 560m
    depends_on:
      langfuse-postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    environment:
      # Same credentials as the web container, its own (much smaller) heap.
      <<: *langfuse-env
      NODE_OPTIONS: "--max-old-space-size=380"

  langfuse-postgres:
    image: postgres:17-alpine
    container_name: arc-rector-langfuse-postgres
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./deploy/a1-setup.sh --gen-secrets first}
      POSTGRES_DB: postgres
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: arc-rector-clickhouse
    restart: unless-stopped
    # ClickHouse assumes it owns the machine. On a shared box it must be told
    # otherwise, in BOTH places: the cgroup limit and its own server config
    # (deploy/clickhouse-low-mem.xml, whose ceilings are set against this
    # number -- move one and you must move the other).
    mem_limit: 900m
    memswap_limit: 900m
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?run ./deploy/a1-setup.sh --gen-secrets first}
      CLICKHOUSE_SKIP_USER_SETUP: "0"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./deploy/clickhouse-low-mem.xml:/etc/clickhouse-server/config.d/low-mem.xml:ro
    healthcheck:
      # 127.0.0.1, not localhost. On a host without IPv6 the container's
      # /etc/hosts still maps localhost to ::1 first, busybox wget tries that
      # and gets ECONNREFUSED from a server that is listening perfectly well on
      # 0.0.0.0:8123 -- so a healthy ClickHouse never goes healthy, and
      # everything with `condition: service_healthy` on it waits forever.
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: arc-rector-redis
    restart: unless-stopped
    mem_limit: 160m
    command: >
      --requirepass ${REDIS_PASSWORD:?run ./deploy/a1-setup.sh --gen-secrets first}
      --maxmemory 100mb
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: arc-rector-minio
    restart: unless-stopped
    mem_limit: 160m
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?run ./deploy/a1-setup.sh --gen-secrets first}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # The web UI. This is what the Cloudflare tunnel points at -- see DEPLOY.md.
  #
  # Built with EXTRAS=ui only: on a 2-OCPU ARM box, compiling the mem0 and
  # guardrails-ai dependency trees costs far more than they are worth for a
  # query-only service, so L7 and L8 are pinned to their dependency-free
  # adapters. The sidebar then shows `local` and `builtin`, which is the truth.
  ui:
    build:
      context: .
      dockerfile: deploy/Dockerfile.ui
      args:
        EXTRAS: "ui"
    image: arc-rector-ui:a1
    container_name: arc-rector-ui
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    depends_on:
      qdrant: { condition: service_healthy }
    ports:
      # 127.0.0.1 only. The box's ingress is TCP 22 and nothing else; the tunnel
      # reaches this from inside the machine.
      - "127.0.0.1:${ARC_PORT_UI:-8800}:8800"
    environment:
      # ARC_<LEVEL>__<SETTING> beats config.yaml's adapter block, including the
      # `l4_vectorstore.qdrant.url` and `l5_embeddings.nomic.base_url` that name
      # localhost there. Inside a compose network localhost is this container.
      ARC_L4_VECTORSTORE__URL: http://qdrant:6333
      ARC_L1_OBSERVABILITY__HOST: http://langfuse-web:3000
      ARC_L1_OBSERVABILITY__PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?run ./deploy/a1-setup.sh --gen-secrets first}
      ARC_L1_OBSERVABILITY__SECRET_KEY: ${LANGFUSE_SECRET_KEY:?run ./deploy/a1-setup.sh --gen-secrets first}
      ARC_L0_INFERENCE__BASE_URL: http://ollama:11434
      ARC_L5_EMBEDDINGS__BASE_URL: http://ollama:11434
      ARC_L0_INFERENCE__MODEL: ${ARC_MODEL:-llama3.2:3b}
      # CPU-only ARM: an uncapped generation can outlive the client.
      ARC_L0_INFERENCE__TIMEOUT: "600"
      # 2 OCPU, and the KV cache is charged to Ollama's 3750 MB. 4096 halves it
      # against the 8192 in config.yaml and costs nothing: the pipeline caps
      # retrieved context at 6000 characters, well inside 4096 tokens.
      ARC_L0_INFERENCE__NUM_CTX: "4096"
      ARC_L0_INFERENCE__NUM_THREAD: "2"
      ARC_L0_INFERENCE__NUM_PREDICT: "384"
      ARC_L7_MEMORY: local
      ARC_L8_GUARDRAILS: builtin
      # Whatever hostname the tunnel serves Langfuse on. Without it every trace
      # link on the page points at `langfuse-web`, which no browser can resolve.
      ARC_UI_TRACE_BASE: ${ARC_UI_TRACE_BASE:-http://localhost:${ARC_PORT_LANGFUSE:-3000}}
      # Comma-separated Host allowlist. Set this to the tunnel hostname once it
      # is stable: it is what stops a DNS-rebinding page in someone's browser
      # from driving a service that only listens on loopback. Empty = allow any,
      # which is the only workable setting for an ephemeral quick tunnel.
      ARC_UI_ALLOWED_HOSTS: ${ARC_UI_ALLOWED_HOSTS:-}
      # HTTP basic auth, off unless the user is set. A tunnel is a public
      # endpoint; set both of these in .env before you publish one. They are
      # deliberately NOT defaulted here -- a password in a public repository is
      # not a password.
      ARC_UI_BASIC_AUTH_USER: ${ARC_UI_BASIC_AUTH_USER:-}
      ARC_UI_BASIC_AUTH_PASSWORD: ${ARC_UI_BASIC_AUTH_PASSWORD:-}

  # L0 in a container. Disable with `--scale ollama=0` and set
  # ARC_L0_INFERENCE=nim to keep no model weights on the box at all.
  ollama:
    image: ollama/ollama:0.32.6          # multi-arch, includes linux/arm64
    container_name: arc-rector-ollama
    restart: unless-stopped
    # Gets every megabyte the other eight services do not need. It is the only
    # one whose ceiling is a hard functional limit rather than headroom: at
    # 3300 MB the cgroup OOM killer took llama-server mid-answer
    # ("llama-server process has terminated: signal: killed").
    mem_limit: 3750m
    memswap_limit: 3750m
    ports:
      - "127.0.0.1:${ARC_PORT_OLLAMA:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      # 2 OCPU. Leave nothing for the other tenants to fight over.
      OLLAMA_NUM_PARALLEL: "1"
      # One resident model, not two. Keeping nomic-embed-text loaded alongside
      # the 3B is what pushed the container over its limit; the reload cost on
      # each embed is a few hundred milliseconds, and being killed is worse.
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "10m"

volumes:
  qdrant_data:
  langfuse_postgres_data:
  clickhouse_data:
  redis_data:
  minio_data:
  ollama_models:

# mem_limit budget -- 7998 MB, under an 8 GB (8192 MB) allowance.
#
#   ollama          3750     langfuse-postgres  256
#   langfuse-web    1700     ui                 256
#   clickhouse       900     minio              160
#   langfuse-worker  560     redis              160
#   qdrant           256                       ----
#                                              7998
#
# These are not round numbers because they are not guesses. Measured usage at
# rest, on the reference A1 box with the stack idle: clickhouse 102M,
# langfuse-worker 360M, minio 113M, postgres 96M, qdrant 25M, ui 36M, redis 10M.
# Everything except Ollama and langfuse-web is cut to a little over what it was
# observed to need, and the slack is given to the two that genuinely use it:
#
#   * ollama -- the only limit here that is a functional constraint. Below
#     ~3.5 GB the model process gets OOM killed part way through an answer.
#   * langfuse-web -- Node sizes its heap from the cgroup; too small a limit
#     produces a boot loop rather than a slow service.
#
# Keep the total under 8 GB: this box is shared, and the 11 GB of host RAM is
# not ours alone. If you raise one limit, take it from another.
#
# Host ports are variables, all defaulting to the obvious value and all bound to
# 127.0.0.1. Set them in .env when a port is already taken on a shared box --
# the reference box runs someone else's service on 3000, so it sets
# ARC_PORT_LANGFUSE=3100. Container-to-container traffic is unaffected either
# way; only the published host side moves.
#
#   ARC_PORT_UI        8800    the web UI -- what the tunnel points at
#   ARC_PORT_LANGFUSE  3000    Langfuse
#   ARC_PORT_QDRANT    6333    Qdrant REST + dashboard
#   ARC_PORT_OLLAMA   11434    Ollama
