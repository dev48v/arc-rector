[build-system]
# 78.1.1 is the fix for PYSEC-2025-49 (path traversal in PackageIndex).
requires = ["setuptools>=78.1.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arc-rector"
version = "0.1.0"
description = "A complete agentic RAG stack built entirely from open-source components. Zero vendor bills, no API keys."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Devanshu Biswas" }]
keywords = ["rag", "agents", "langgraph", "qdrant", "ollama", "self-hosted", "open-source"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The core install is deliberately small: HTTP + a vector store + a graph.
# Every heavy layer is an optional extra, so `pip install arc-rector` never
# drags in torch by surprise.
dependencies = [
    "pyyaml>=6.0",
    # 2.32.4 or newer: 2.31 leaks a session's verify=False (CVE-2024-35195) and
    # everything before 2.32.4 can send .netrc credentials to a redirect target
    # (CVE-2024-47081). The L6 loader follows URLs somebody else chose, so both
    # of those are on the live path, not theoretical.
    "requests>=2.32.4",
    "qdrant-client>=1.9",
    "langgraph>=0.2",
    "langfuse>=3.0",
]

[project.optional-dependencies]
# L6 -- real document parsing (pulls torch and layout models, ~1 GB+)
ingest = ["docling>=2.0"]
# L7 -- LLM-managed memory
memory = ["mem0ai>=0.1"]
# L8 -- the validation engine
guardrails = ["guardrails-ai>=0.5"]
# L1 -- judged evaluation with a local judge.
# langchain-community is pinned below 0.4: ragas 0.4.x still imports
# langchain_community.chat_models.vertexai, which 0.4 removed, so an unpinned
# install fails at `import ragas` with a ModuleNotFoundError.
eval = [
    "ragas>=0.2",
    "langchain-ollama>=0.2",
    "langchain-community<0.4",
    "pandas>=2.0",
]
# L4 -- alternative vector stores
chroma = ["chromadb>=0.5"]
pgvector = ["psycopg[binary]>=3.1"]
milvus = ["pymilvus>=2.4"]
# L5 -- local embedding models and cross-encoder reranking
embeddings = ["sentence-transformers>=3.0"]
# L3 -- alternative agent frameworks
llamaindex = ["llama-index-core>=0.11"]
haystack = ["haystack-ai>=2.0"]
crewai = ["crewai>=0.70"]
dspy = ["dspy>=2.5"]
# The web chat UI. Small on purpose: one HTML file with no build step, so the
# server is the only thing that needs installing.
ui = ["fastapi>=0.110", "uvicorn>=0.30"]
# Everything that runs comfortably without a GPU.
all = [
    "arc-rector[ingest,memory,guardrails,eval,chroma,pgvector,embeddings,ui]",
]
# httpx backs fastapi's TestClient, which is how the API tests run with no server.
# pip-audit runs in CI so a new advisory against a transitive package surfaces
# as a build signal rather than as a surprise for whoever cloned this.
dev = ["pytest>=8.0", "pytest-cov>=5.0", "fastapi>=0.110", "httpx>=0.27", "pip-audit>=2.7", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/dev48v/arc-rector"
Repository = "https://github.com/dev48v/arc-rector"
Issues = "https://github.com/dev48v/arc-rector/issues"

[project.scripts]
arc-rector = "arc_rector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The UI is a data file, not a module, so it has to be named explicitly or a
# wheel install serves a 500 from a package that looks complete.
[tool.setuptools.package-data]
arc_rector = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: needs a running container or model (deselect with -m 'not integration')",
]

[tool.ruff]
line-length = 100
target-version = "py310"

# Selected explicitly so a new ruff release cannot change what CI means.
# Deliberately excludes BLE001/S110: the adapters swallow exceptions on purpose
# -- memory and tracing degrade rather than fail a turn, which is a documented
# stance in PRODUCTION.md, not an oversight.
[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
